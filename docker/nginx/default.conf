server {
    listen 80;
    server_name _;

    # Only public/ is served. Everything else — src, config, .env, vendor —
    # sits outside the web root and is unreachable by design.
    root /var/www/html/public;
    index index.php;

    client_max_body_size 8m;

    # Uploaded logos are static files and must never be executed.
    location ^~ /assets/logos/ {
        add_header X-Content-Type-Options "nosniff" always;
        default_type application/octet-stream;
        types { image/png png; image/jpeg jpg jpeg; image/gif gif; image/webp webp; }
        try_files $uri =404;
    }

    location /assets/ {
        expires 7d;
        add_header Cache-Control "public";
        try_files $uri =404;
    }

    location / {
        try_files $uri /index.php$is_args$args;
    }

    location ~ ^/index\.php$ {
        fastcgi_pass app:9000;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $document_root;
        fastcgi_read_timeout 60s;
    }

    # No other PHP file is directly reachable.
    location ~ \.php$ {
        return 404;
    }

    location ~ /\. {
        deny all;
    }

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "same-origin" always;
}
