# The Renovo API, version 1.
#
# This file is the source of truth, not a rendering of one. It is written by
# hand, served verbatim at /api/v1/openapi.yaml, and checked against the
# application's own route table in CI: an endpoint that exists without being
# described here fails the build, and so does a description with no endpoint
# behind it.
openapi: 3.0.3

info:
  title: Renovo API
  version: "1.0.0"
  description: |
    Read and write subscriptions, categories, tags and attachments.

    **Authentication.** Every endpoint except the two OpenAPI documents needs a
    token, issued under Settings → API tokens and sent as
    `Authorization: Bearer rnv_<public id>_<secret>`. Session cookies are not
    accepted: the API is deliberately unreachable with a browser's ambient
    credentials, which is what makes it safe for it to be exempt from CSRF
    tokens.

    **A token narrows, it never grants.** The request runs under the household
    role of the account that issued the token, so a Viewer's write token still
    cannot write. A read-only token is refused any unsafe method outright.

    **Money is always an integer in minor units** (`price_minor: 1999` with
    `currency: GBP` is £19.99), never a decimal. JSON numbers are binary floats
    in most clients and 19.99 is not representable in one.

    **There is no PATCH.** `PUT` replaces the whole resource. To change one
    field, `GET` the resource, edit the representation and `PUT` it back.

    **Not in version 1.** Shared-cost splits, scheduled price changes and the
    usage counter are editable in the web interface but have no endpoints here.
    Each is a sub-resource with rules of its own — a split has to total its
    shares, a scheduled price has an effective date that interacts with the
    price history, a usage count has a period it is measured over — and giving
    each a half-considered endpoint now would fix a shape that is awkward to
    change once clients depend on it. They read as part of a subscription
    (`split_mode`, `usage_count`, `usage_rating`) and are written through the
    web interface until a later version describes them properly.
  license:
    name: MIT

servers:
  - url: /
    description: This instance.

tags:
  - name: Subscriptions
  - name: Attachments
  - name: Taxonomy
  - name: Calendar
  - name: Meta

security:
  - bearerToken: []

paths:
  /api/v1/openapi.yaml:
    get:
      tags: [Meta]
      summary: This document, as YAML.
      security: []
      responses:
        "200":
          description: The OpenAPI document.
          content:
            application/yaml:
              schema:
                type: string

  /api/v1/openapi.json:
    get:
      tags: [Meta]
      summary: This document, as JSON.
      security: []
      responses:
        "200":
          description: The OpenAPI document.
          content:
            application/json:
              schema:
                type: object

  /api/v1/me:
    get:
      tags: [Meta]
      summary: The token's identity, role and effective permissions.
      responses:
        "200":
          description: Who this token is.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: "#/components/schemas/Identity"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/v1/subscriptions:
    get:
      tags: [Subscriptions]
      summary: List subscriptions.
      description: |
        Returns only what the token's role and the instance's isolation mode
        allow — the same rows the same user would see in the web interface.
      parameters:
        - { name: q, in: query, schema: { type: string }, description: Search names and notes. }
        - { name: category, in: query, schema: { type: integer }, description: Category id. }
        - { name: owner, in: query, schema: { type: integer }, description: Owner user id. }
        - { name: currency, in: query, schema: { type: string }, description: ISO 4217 code. }
        - name: type
          in: query
          schema: { type: string, enum: [recurring, one_off, lifetime] }
        - name: inactive
          in: query
          schema: { type: string, enum: ["1"] }
          description: Include inactive subscriptions.
        - name: sort
          in: query
          schema: { type: string, enum: [name, next_payment, price, created] }
        - { name: dir, in: query, schema: { type: string, enum: [asc, desc] } }
        - { name: page, in: query, schema: { type: integer, minimum: 1 } }
        - name: per_page
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 25 }
      responses:
        "200":
          description: A page of subscriptions.
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/Subscription"
                  meta:
                    $ref: "#/components/schemas/Page"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

    post:
      tags: [Subscriptions]
      summary: Create a subscription.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SubscriptionInput"
      responses:
        "201":
          description: Created.
          headers:
            Location:
              schema: { type: string }
              description: The new subscription's URL.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: "#/components/schemas/Subscription"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          $ref: "#/components/responses/ValidationFailed"

  /api/v1/subscriptions/{id}:
    parameters:
      - $ref: "#/components/parameters/SubscriptionId"
    get:
      tags: [Subscriptions]
      summary: Fetch one subscription.
      responses:
        "200":
          description: The subscription.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: "#/components/schemas/Subscription"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

    put:
      tags: [Subscriptions]
      summary: Replace a subscription.
      description: |
        A full replacement. Any field the body omits takes its documented
        default, so read the resource and send it back edited rather than
        sending only what changed.

        The logo is the one exception: it is a file with endpoints of its own,
        and a `PUT` leaves it as it is.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SubscriptionInput"
      responses:
        "200":
          description: The updated subscription.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: "#/components/schemas/Subscription"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationFailed"

    delete:
      tags: [Subscriptions]
      summary: Delete a subscription.
      responses:
        "204":
          description: Deleted.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/subscriptions/{id}/logo:
    parameters:
      - $ref: "#/components/parameters/SubscriptionId"
    post:
      tags: [Subscriptions]
      summary: Replace the subscription's logo.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [logo]
              properties:
                logo:
                  type: string
                  format: binary
                  description: PNG, JPEG, GIF or WebP. The type is read from the file, not its name.
      responses:
        "200":
          description: The updated subscription.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: "#/components/schemas/Subscription"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationFailed"

    delete:
      tags: [Subscriptions]
      summary: Remove the subscription's logo.
      responses:
        "204":
          description: Removed.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/subscriptions/{id}/attachments:
    parameters:
      - $ref: "#/components/parameters/SubscriptionId"
    get:
      tags: [Attachments]
      summary: List the invoices and receipts filed against a subscription.
      responses:
        "200":
          description: The attachments.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/Attachment"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

    post:
      tags: [Attachments]
      summary: Attach an invoice or receipt.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
                  description: |
                    PDF, PNG, JPEG, WebP or GIF. The type is determined from the
                    file's contents; the filename and the declared content type
                    are ignored.
                period_date:
                  type: string
                  format: date
                  nullable: true
                  description: The billing period this document covers, if any.
      responses:
        "201":
          description: Stored.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: "#/components/schemas/Attachment"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          $ref: "#/components/responses/ValidationFailed"

  /api/v1/subscriptions/{id}/attachments/{attachmentId}:
    parameters:
      - $ref: "#/components/parameters/SubscriptionId"
      - name: attachmentId
        in: path
        required: true
        schema: { type: integer }
    get:
      tags: [Attachments]
      summary: Download an attachment.
      responses:
        "200":
          description: The file.
          headers:
            Content-Disposition:
              schema: { type: string }
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

    delete:
      tags: [Attachments]
      summary: Delete an attachment.
      responses:
        "204":
          description: Deleted.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/categories:
    get:
      tags: [Taxonomy]
      summary: List categories.
      responses:
        "200":
          description: The household's categories.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/Category"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

    post:
      tags: [Taxonomy]
      summary: Create a category.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string, maxLength: 60 }
                colour:
                  type: string
                  nullable: true
                  pattern: "^#[0-9a-fA-F]{6}$"
      responses:
        "201":
          description: Created.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: "#/components/schemas/Category"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          $ref: "#/components/responses/ValidationFailed"

  /api/v1/categories/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: integer }
    put:
      tags: [Taxonomy]
      summary: Rename or recolour a category.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string, maxLength: 60 }
                colour:
                  type: string
                  nullable: true
                  pattern: "^#[0-9a-fA-F]{6}$"
      responses:
        "200":
          description: The updated category.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: "#/components/schemas/Category"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationFailed"

    delete:
      tags: [Taxonomy]
      summary: Delete a category.
      responses:
        "204":
          description: Deleted.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/tags:
    get:
      tags: [Taxonomy]
      summary: List tags.
      description: |
        Tags have no create endpoint. They are created by naming them on a
        subscription, exactly as in the web form, so there is one place that
        decides how they are deduplicated.
      responses:
        "200":
          description: The household's tags.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/Tag"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /api/v1/tags/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: integer }
    delete:
      tags: [Taxonomy]
      summary: Delete a tag.
      responses:
        "204":
          description: Deleted.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/calendar.ics:
    get:
      tags: [Calendar]
      summary: Renewals, trial conversions and cancellation deadlines as iCalendar.
      description: |
        A read-only feed for a calendar client. Because such a client cannot
        send an `Authorization` header, this endpoint — and only this endpoint —
        takes its token in the `token` query parameter, and accepts read-only
        tokens exclusively. A write-capable token is refused rather than
        downgraded: a credential that can change data does not belong in a
        subscription URL.
      security: []
      parameters:
        - name: token
          in: query
          required: true
          schema: { type: string }
          description: A read-only API token.
      responses:
        "200":
          description: An iCalendar document.
          content:
            text/calendar:
              schema:
                type: string
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: The token is write-capable, and this endpoint takes read-only tokens.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

components:
  securitySchemes:
    bearerToken:
      type: http
      scheme: bearer
      description: An API token issued under Settings → API tokens.

  parameters:
    SubscriptionId:
      name: id
      in: path
      required: true
      schema: { type: integer }

  responses:
    BadRequest:
      description: The request was malformed.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Unauthorized:
      description: No token was presented, or it is revoked, expired or unknown.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Forbidden:
      description: The token's role does not permit this.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    NotFound:
      description: |
        No such row — or one the caller may not see. The two are deliberately
        indistinguishable, so that probing for another household's ids tells the
        prober nothing.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    ValidationFailed:
      description: The body was understood but is not valid.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"

  schemas:
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [status, title, message]
          properties:
            status: { type: integer }
            title: { type: string }
            message: { type: string }
            errors:
              type: object
              description: Field name to message. Present on a 422.
              additionalProperties: { type: string }

    Page:
      type: object
      required: [page, per_page, total, total_pages]
      properties:
        page: { type: integer }
        per_page: { type: integer }
        total: { type: integer }
        total_pages: { type: integer }

    Identity:
      type: object
      required: [user, household_id, role, isolation_mode, permissions]
      properties:
        user:
          type: object
          required: [id, email, display_name, is_instance_admin]
          properties:
            id: { type: integer }
            email: { type: string }
            display_name: { type: string }
            is_instance_admin: { type: boolean }
        household_id: { type: integer, nullable: true }
        role:
          type: string
          nullable: true
          enum: [owner_admin, editor, viewer]
        isolation_mode:
          type: string
          enum: [shared, isolated]
        permissions:
          type: array
          items: { type: string }

    Category:
      type: object
      required: [id, name, colour]
      properties:
        id: { type: integer }
        name: { type: string }
        colour: { type: string, nullable: true }

    Tag:
      type: object
      required: [id, name]
      properties:
        id: { type: integer }
        name: { type: string }

    Attachment:
      type: object
      required: [id, subscription_id, filename, mime_type, size_bytes, period_date, created_at]
      properties:
        id: { type: integer }
        subscription_id: { type: integer }
        filename: { type: string }
        mime_type: { type: string }
        size_bytes: { type: integer }
        period_date: { type: string, format: date, nullable: true }
        created_at: { type: string, format: date-time }

    SubscriptionInput:
      type: object
      required: [name, price_minor, currency]
      description: |
        The writable half of a subscription. Everything the web form can set is
        here; the derived figures and the logo are not.
      properties:
        name: { type: string, maxLength: 150 }
        notes: { type: string, nullable: true, maxLength: 5000 }
        price_minor:
          type: integer
          description: Minor units. £19.99 is 1999.
        currency: { type: string, description: ISO 4217 code. }
        subscription_type:
          type: string
          enum: [recurring, one_off, lifetime]
          default: recurring
        billing_cycle:
          type: string
          nullable: true
          enum: [weekly, monthly, quarterly, yearly, custom_days]
        cycle_days:
          type: integer
          nullable: true
          minimum: 1
          maximum: 3650
          description: Required when billing_cycle is custom_days.
        next_payment_date:
          type: string
          format: date
          nullable: true
          description: Required for a recurring subscription that is not a trial.
        start_date: { type: string, format: date, nullable: true }
        notice_period_amount: { type: integer, nullable: true, minimum: 0, maximum: 3650 }
        notice_period_unit:
          type: string
          nullable: true
          enum: [days, weeks, months]
        reminder_days:
          type: array
          nullable: true
          items: { type: integer, minimum: 0, maximum: 365 }
          maxItems: 6
          description: |
            Three states. Omitted or null means "use my notification
            preference"; an empty array means "never remind me about this one";
            a list of lead times overrides the preference for this subscription.
        is_trial: { type: boolean, default: false }
        trial_end_date: { type: string, format: date, nullable: true }
        converts_to_price_minor: { type: integer, nullable: true }
        converts_to_billing_cycle:
          type: string
          nullable: true
          enum: [weekly, monthly, quarterly, yearly, custom_days]
        converts_to_cycle_days: { type: integer, nullable: true }
        is_active: { type: boolean, default: true }
        category_id: { type: integer, nullable: true }
        owner_user_id:
          type: integer
          nullable: true
          description: |
            Must be a member of the household. Ignored when the instance is in
            ISOLATED mode, where a user may only own their own rows.
        payer_user_id: { type: integer, nullable: true }
        tags:
          type: array
          items: { type: string, maxLength: 50 }
          maxItems: 25
          description: Tags are created by name if they do not exist.

    Subscription:
      allOf:
        - $ref: "#/components/schemas/SubscriptionInput"
        - type: object
          required:
            - id
            - price_minor
            - currency
            - is_active
            - created_at
            - updated_at
          properties:
            id: { type: integer }
            anchor_day:
              type: integer
              nullable: true
              description: The day of the month billing returns to after a short month.
            category_name: { type: string, nullable: true }
            split_mode: { type: string }
            usage_count: { type: integer }
            usage_rating: { type: integer, nullable: true }
            logo_path:
              type: string
              nullable: true
              description: Read-only. Set it with the logo endpoints.
            monthly_minor:
              type: integer
              nullable: true
              description: Read-only. Equivalent monthly cost in minor units.
            yearly_minor: { type: integer, nullable: true }
            next_charge_date:
              type: string
              format: date
              nullable: true
              description: |
                Read-only. The trial's conversion date while a trial is running,
                and the next payment date otherwise.
            cancellation_deadline:
              type: string
              format: date
              nullable: true
              description: Read-only. The last day to cancel and avoid the next charge.
            days_until_next_payment: { type: integer, nullable: true }
            created_at: { type: string, format: date-time }
            updated_at: { type: string, format: date-time }
